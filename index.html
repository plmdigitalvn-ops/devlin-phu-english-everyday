<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devlin Phu English Everyday</title>
<style>
:root{--bg:#f4f6ff;--card:#fff;--tx:#1d2140;--mu:#6b7194;--ac:#5b5bf0;--ac2:#8b5cf6;--acx:#fff;--ok:#12805c;--bad:#c4321f;--bd:#e4e7f5;--warm:#fff4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10121f;--card:#1b1f36;--tx:#eef0ff;--mu:#9aa1c8;--ac:#8c8cff;--ac2:#a78bfa;--acx:#10122a;--ok:#4cd2a0;--bad:#ff8a77;--bd:#2c3253;--warm:#3a2f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10121f;--card:#1b1f36;--tx:#eef0ff;--mu:#9aa1c8;--ac:#8c8cff;--ac2:#a78bfa;--acx:#10122a;--ok:#4cd2a0;--bad:#ff8a77;--bd:#2c3253;--warm:#3a2f1c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Nunito","Segoe UI",system-ui,-apple-system,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:18px 16px 26px;border-radius:0 0 26px 26px}
.hw{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-weight:800;font-size:20px;line-height:1.15}.logo small{display:block;font-weight:600;font-size:12px;opacity:.85;letter-spacing:.5px}
.streak{background:rgba(255,255,255,.2);padding:8px 14px;border-radius:99px;font-weight:800;white-space:nowrap}
main{max-width:640px;margin:-14px auto 0;padding:0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(70,70,160,.07)}
h2{font-size:19px;margin:6px 2px 10px}h3{margin:0 0 6px}
.mu,.hint{color:var(--mu);font-size:14px}
.banner{background:var(--warm);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{padding:7px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.flash{min-height:210px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;user-select:none;position:relative}
.big{font-size:34px;font-weight:800}.vi{font-size:24px;font-weight:800;color:var(--ac)}.ex{color:var(--mu);font-size:15px}
.star{position:absolute;top:10px;right:12px;font-size:26px;background:none;border:0;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;min-width:90px}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.les table{width:100%;border-collapse:collapse;font-size:15px}.les td{padding:5px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
.formula{background:var(--bg);border:1px dashed var(--bd);border-radius:12px;padding:9px 12px;margin:8px 0;font-weight:700}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bm{background:none;border:1px solid var(--bd);border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--tx);font:inherit;font-size:14px;white-space:nowrap}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.fb{margin-top:8px;font-size:15px}
.sv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.sv:last-child{border:0}
.dots{display:flex;gap:6px;margin-top:8px}.dots span{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;background:var(--bd);color:var(--mu)}.dots span.d{background:var(--ok);color:#fff}
input[type=time]{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:120px;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;font-weight:700;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button b{display:block;font-size:21px;line-height:1.2}nav button.on{color:var(--ac);background:var(--bg)}
textarea,.ci{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);resize:vertical}
.hw{flex-wrap:wrap}
.msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.bub{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.tip{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--warm);font-size:14px}
.cin{display:flex;gap:8px;align-items:center}
.cin .btn{flex:none;min-width:0;padding:12px 16px}
</style>
</head>
<body>
<header><div class="hw"><div class="logo">Devlin Phu<small>ENGLISH EVERYDAY</small></div><div style="display:flex;gap:8px"><div class="streak" id="streak"></div><button class="streak" style="border:0;color:#fff;cursor:pointer;font:inherit" onclick="go(6)">⭐ Đã lưu</button></div></div></header>
<main><div id="view"></div></main>
<nav id="nav"></nav>
<script>
var V={
"Công việc":[["meeting","cuộc họp","I have a meeting at 9.","Tôi có cuộc họp lúc 9 giờ."],["deadline","hạn chót","The deadline is Friday.","Hạn chót là thứ Sáu."],["boss","sếp","My boss is very kind.","Sếp tôi rất tốt bụng."],["colleague","đồng nghiệp","She is my colleague.","Cô ấy là đồng nghiệp của tôi."],["salary","lương","I want a higher salary.","Tôi muốn lương cao hơn."],["task","nhiệm vụ","I finished the task.","Tôi đã hoàn thành nhiệm vụ."],["report","báo cáo","Please send me the report.","Làm ơn gửi tôi bản báo cáo."],["customer","khách hàng","The customer is waiting.","Khách hàng đang chờ."]],
"Hàng ngày":[["wake up","thức dậy","I wake up at six.","Tôi thức dậy lúc sáu giờ."],["breakfast","bữa sáng","I eat breakfast at home.","Tôi ăn sáng ở nhà."],["go to work","đi làm","I go to work by bike.","Tôi đi làm bằng xe đạp."],["tired","mệt","I am tired today.","Hôm nay tôi mệt."],["busy","bận","I am busy now.","Bây giờ tôi đang bận."],["free time","thời gian rảnh","I read in my free time.","Tôi đọc sách lúc rảnh."],["sleep","ngủ","I sleep at eleven.","Tôi ngủ lúc mười một giờ."],["weekend","cuối tuần","I rest on the weekend.","Tôi nghỉ ngơi vào cuối tuần."]],
"Mua sắm, ăn uống":[["How much?","Bao nhiêu tiền?","How much is this?","Cái này giá bao nhiêu?"],["expensive","đắt","It is too expensive.","Nó đắt quá."],["cheap","rẻ","This shirt is cheap.","Cái áo này rẻ."],["discount","giảm giá","Is there a discount?","Có giảm giá không?"],["menu","thực đơn","Can I see the menu?","Cho tôi xem thực đơn được không?"],["bill","hóa đơn","The bill, please.","Cho tôi tính tiền."],["order","gọi món, đặt hàng","I would like to order.","Tôi muốn gọi món."],["delicious","ngon","The food is delicious.","Đồ ăn rất ngon."]],
"Đi lại, hỏi đường":[["left / right","trái / phải","Turn left here.","Rẽ trái ở đây."],["straight","thẳng","Go straight.","Đi thẳng."],["near","gần","It is near here.","Nó ở gần đây."],["far","xa","Is it far?","Có xa không?"],["ticket","vé","I need a ticket.","Tôi cần một vé."],["late","muộn, trễ","Sorry, I am late.","Xin lỗi, tôi đến trễ."],["lost","bị lạc","I am lost.","Tôi bị lạc."],["address","địa chỉ","What is your address?","Địa chỉ của bạn là gì?"]],
"Động từ hay dùng":[["need","cần","I need help.","Tôi cần giúp đỡ."],["want","muốn","I want some water.","Tôi muốn một ít nước."],["understand","hiểu","I do not understand.","Tôi không hiểu."],["know","biết","I do not know.","Tôi không biết."],["help","giúp","Can you help me?","Bạn giúp tôi được không?"],["wait","chờ","Please wait a moment.","Xin chờ một chút."],["ask","hỏi","I want to ask a question.","Tôi muốn hỏi một câu."],["repeat","nhắc lại","Can you repeat that?","Bạn nhắc lại được không?"]]
};
var G=[
{t:"1. Động từ to be (am / is / are)",b:"<p>Dùng để nói “là, thì, ở”. Đây là nền tảng quan trọng nhất.</p><table><tr><td>I</td><td><b>am</b></td><td>I am a teacher.</td></tr><tr><td>He / She / It</td><td><b>is</b></td><td>She is tired.</td></tr><tr><td>You / We / They</td><td><b>are</b></td><td>They are at work.</td></tr></table><div class='formula'>Phủ định: thêm not → I am not busy.<br>Câu hỏi: đảo to be lên đầu → Are you busy?</div>"},
{t:"2. Hiện tại đơn (thói quen, sự thật)",b:"<p>Nói về việc làm thường xuyên hoặc điều luôn đúng.</p><div class='formula'>I / You / We / They + động từ<br>He / She / It + động từ<b>-s</b></div><p>I work every day. → She work<b>s</b> every day.</p><div class='formula'>Phủ định: do not (don’t) / does not (doesn’t) + động từ gốc<br>Hỏi: Do you work here? / Does he work here?</div><p>Lưu ý: sau does / doesn’t, động từ bỏ -s: He doesn’t work.</p>"},
{t:"3. Hiện tại tiếp diễn (đang làm)",b:"<p>Nói việc đang xảy ra ngay lúc này.</p><div class='formula'>am / is / are + động từ-<b>ing</b></div><p>I am working now.<br>She is eating lunch.<br>Are you listening?</p>"},
{t:"4. Quá khứ đơn (đã làm)",b:"<p>Nói việc đã xảy ra và kết thúc.</p><div class='formula'>Động từ thường + <b>ed</b>: work → worked, finish → finished</div><table><tr><td>go → <b>went</b></td><td>eat → <b>ate</b></td></tr><tr><td>have → <b>had</b></td><td>see → <b>saw</b></td></tr><tr><td>buy → <b>bought</b></td><td>do → <b>did</b></td></tr></table><div class='formula'>Phủ định: did not (didn’t) + động từ gốc → I didn’t go.<br>Hỏi: Did you go? → Yes, I did.</div>"},
{t:"5. Tương lai: will và going to",b:"<div class='formula'>will + động từ: quyết định tại chỗ, lời hứa<br>am/is/are going to + động từ: kế hoạch đã có</div><p>I will help you.<br>I am going to visit Da Nang next week.</p>"},
{t:"6. Can, want to, would like to, have to",b:"<table><tr><td><b>can</b> + V</td><td>có thể, biết làm. I can swim.</td></tr><tr><td><b>want to</b> + V</td><td>muốn. I want to learn English.</td></tr><tr><td><b>would like to</b> + V</td><td>muốn (lịch sự). I would like to order.</td></tr><tr><td><b>have to</b> + V</td><td>phải. I have to work today.</td></tr></table><p>Xin giúp lịch sự: <b>Could you</b> help me, please?</p>"},
{t:"7. There is / There are, câu hỏi Wh-",b:"<p><b>There is</b> + 1 vật: There is a bank near here.<br><b>There are</b> + nhiều vật: There are two rooms.</p><table><tr><td>What</td><td>cái gì</td><td>What do you do?</td></tr><tr><td>Where</td><td>ở đâu</td><td>Where do you live?</td></tr><tr><td>When</td><td>khi nào</td><td>When is the meeting?</td></tr><tr><td>Who</td><td>ai</td><td>Who is she?</td></tr><tr><td>Why</td><td>tại sao</td><td>Why are you late?</td></tr><tr><td>How</td><td>thế nào</td><td>How are you?</td></tr></table>"}
];
var Q=[
["She ___ a teacher.",["am","is","are"],1,"He / She / It đi với is."],
["They ___ at the office.",["is","am","are"],2,"They đi với are."],
["I ___ coffee every morning.",["drink","drinks","drinking"],0,"Với I dùng động từ nguyên mẫu, không thêm s."],
["He ___ to work by bus.",["go","goes","going"],1,"He + động từ thêm s/es: goes."],
["She ___ like spicy food.",["don’t","doesn’t","isn’t"],1,"Ngôi he/she/it dùng doesn’t."],
["Right now, I ___ a report.",["write","wrote","am writing"],2,"Đang làm ngay bây giờ: am + V-ing."],
["Yesterday I ___ to the market.",["go","went","going"],1,"Quá khứ của go là went."],
["___ you understand?",["Do","Does","Are"],0,"Với you dùng Do."],
["I ___ not finish the task yesterday.",["do","does","did"],2,"Phủ định quá khứ: did not + động từ gốc."],
["I ___ call you tomorrow. (hứa)",["will","did","am"],0,"Lời hứa dùng will."],
["___ is a bank near here.",["There","They","Here are"],0,"There is = có (một thứ)."],
["___ you help me, please? (lịch sự)",["Could","Are","Does"],0,"Could you…? là cách nhờ lịch sự."],
["___ do you live? – In Hanoi.",["When","Where","Why"],1,"Hỏi nơi chốn dùng Where."],
["I ___ to finish this today.",["have","has","am"],0,"I have to + V = tôi phải làm."]
];
var ALL=[];Object.keys(V).forEach(function(k){V[k].forEach(function(w){ALL.push(w)})});
var S={tr:[],known:{},saved:{},savedG:{},days:{},rem:{on:false,time:"20:00"},last:""};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("dpee")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("dpee",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function key(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function today(){return S.days[key()]||0}
function done(){S.days[key()]=today()+1;save();head()}
function streak(){var n=0,d=new Date();if(!S.days[key(d)])d.setDate(d.getDate()-1);while(S.days[key(d)]){n++;d.setDate(d.getDate()-1)}return n}
function head(){$("streak").textContent="🔥 "+streak()+" ngày"}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
var tabs=[["🏠","Hôm nay"],["📚","Từ vựng"],["✏️","Ngữ pháp"],["🎯","Luyện tập"],["🌐","Dịch"],["🤖","AI hội thoại"]],cur=0,topic=Object.keys(V)[0],idx=0,flip=false,qi=0,score=0,answered=false;
function nav(){$("nav").innerHTML=tabs.map(function(t,i){return "<button class='"+(i==cur?"on":"")+"' onclick='go("+i+")'><b>"+t[0]+"</b>"+t[1]+"</button>"}).join("")}
function go(i){cur=i;render();window.scrollTo(0,0)}
function render(){nav();head();[home,vocab,gram,quiz,trans,chat,saved][cur]()}
function dayWords(){var d=Math.floor(Date.now()/864e5),o=[];for(var i=0;i<5;i++)o.push(ALL[(d*5+i)%ALL.length]);return o}
function due(){if(!S.rem.on||today())return false;var n=new Date(),p=S.rem.time.split(":");return n.getHours()*60+n.getMinutes()>=+p[0]*60+ +p[1]}
function home(){
var g=["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"][new Date().getDay()],dw=dayWords(),t=Math.min(today(),5);
var h=due()?"<div class='banner'>⏰ Đến giờ học rồi! Hôm nay bạn chưa học bài nào. Chỉ cần 10 phút thôi nhé.</div>":"";
h+="<div class='card'><h3>Chào Devlin 👋</h3><div class='mu'>"+g+", "+key()+"</div><p style='margin:10px 0 0'>Mục tiêu hôm nay: hoàn thành 5 hoạt động (đánh dấu từ, làm câu hỏi).</p><div class='bar'><i style='width:"+t*20+"%'></i></div><div class='hint'>"+t+"/5 hoạt động · chuỗi "+streak()+" ngày liên tiếp</div>"+week()+"</div>";
h+="<h2>🌟 5 từ của hôm nay</h2><div class='card'>"+dw.map(function(w){return "<div class='sv'><div><b>"+w[0]+"</b> · <span style='color:var(--ac)'>"+w[1]+"</span><div class='ex'>"+w[2]+"</div></div><div class='row' style='flex:none;flex-wrap:nowrap'><button class='bm' onclick='speak(\""+w[2].replace(/"/g,"")+"\")'>🔊</button><button class='bm' onclick='tog(\""+w[0]+"\")'>"+(S.saved[w[0]]?"⭐":"☆")+"</button></div></div>"}).join("")+"</div>";
h+="<h2>⏰ Nhắc học hàng ngày</h2><div class='card'><div class='row' style='align-items:center'><label><input type='checkbox' id='ron' "+(S.rem.on?"checked":"")+" onchange='setRem()'> Bật nhắc nhở</label><input type='time' id='rt' value='"+S.rem.time+"' onchange='setRem()'></div><p class='hint' style='margin:8px 0 0'>Trình duyệt sẽ gửi thông báo vào giờ bạn chọn nếu bạn chưa học, khi trang này đang mở (tab nền cũng được). Trang web không thể tự bật khi bạn đã đóng hẳn, nên hãy ghim tab hoặc thêm vào màn hình chính.</p><div class='hint' id='rs'></div></div>";
$("view").innerHTML=h;rstat()}
function week(){var h="<div class='dots'>",d=new Date();d.setDate(d.getDate()-6);for(var i=0;i<7;i++){h+="<span class='"+(S.days[key(d)]?"d":"")+"'>"+["CN","T2","T3","T4","T5","T6","T7"][d.getDay()]+"</span>";d.setDate(d.getDate()+1)}return h+"</div>"}
function rstat(){var e=$("rs");if(!e)return;var p="Notification" in window?Notification.permission:"none";e.textContent=!S.rem.on?"":p=="granted"?"✅ Đã cho phép thông báo. Nhắc lúc "+S.rem.time+".":p=="denied"?"⚠️ Thông báo đang bị chặn trong trình duyệt. Bạn vẫn thấy lời nhắc ngay trên trang này.":"Hãy bấm Cho phép khi trình duyệt hỏi."}
function setRem(){S.rem.on=$("ron").checked;S.rem.time=$("rt").value||"20:00";save();if(S.rem.on&&"Notification" in window&&Notification.permission=="default"){try{Notification.requestPermission().then(rstat)}catch(e){}}rstat()}

function tog(w){if(S.saved[w])delete S.saved[w];else S.saved[w]=1;save();render()}
function vocab(){
var h="<div class='chips'>"+Object.keys(V).map(function(k){return "<button class='chip "+(k==topic?"on":"")+"' onclick='setT(\""+k+"\")'>"+k+"</button>"}).join("")+"</div>";
var l=V[topic],w=l[idx],n=l.filter(function(x){return S.known[x[0]]}).length;
h+="<div class='hint'>Đã nhớ "+n+"/"+l.length+" · Thẻ "+(idx+1)+"/"+l.length+"</div><div class='bar'><i style='width:"+n/l.length*100+"%'></i></div>";
h+="<div class='card flash' onclick='fl()'><button class='star' onclick='event.stopPropagation();tog(\""+w[0]+"\")'>"+(S.saved[w[0]]?"⭐":"☆")+"</button><div class='big'>"+w[0]+"</div>";
h+=flip?"<div class='vi'>"+w[1]+"</div><div>“"+w[2]+"”</div><div class='ex'>"+w[3]+"</div>":"<div class='hint'>Chạm để xem nghĩa</div>";
h+="</div><div class='row'><button class='btn' onclick='sp()'>🔊 Nghe</button><button class='btn' onclick='mark(0)'>Chưa nhớ</button><button class='btn p' onclick='mark(1)'>Đã nhớ ✓</button></div>";
$("view").innerHTML=h}
function setT(k){topic=k;idx=0;flip=false;vocab()}
function fl(){flip=!flip;vocab();if(flip)sp()}
function sp(){var w=V[topic][idx];speak(flip?w[2]:w[0])}
function mark(k){var w=V[topic][idx];if(k)S.known[w[0]]=1;else delete S.known[w[0]];done();idx=(idx+1)%V[topic].length;flip=false;vocab()}
function gram(){$("view").innerHTML=G.map(function(g,i){return "<div class='card les'><div class='lh'><h3>"+g.t+"</h3><button class='bm' onclick='tg("+i+")'>"+(S.savedG[i]?"⭐ Đã lưu":"☆ Lưu")+"</button></div>"+g.b+"</div>"}).join("")}
function tg(i){if(S.savedG[i])delete S.savedG[i];else{S.savedG[i]=1;done()}save();gram()}
function quiz(){
if(qi>=Q.length){var p=score/Q.length;$("view").innerHTML="<div class='card' style='text-align:center'><div class='big'>"+score+"/"+Q.length+"</div><p>"+(p>=.8?"Tuyệt vời! Bạn nắm khá chắc rồi 🎉":p>=.5?"Khá tốt! Xem lại bài Ngữ pháp rồi làm lại nhé.":"Đừng lo, đọc lại Ngữ pháp và thử lần nữa nhé 💪")+"</p><button class='btn p' style='width:100%' onclick='qi=0;score=0;quiz()'>Làm lại</button></div>";return}
var q=Q[qi];answered=false;
$("view").innerHTML="<div class='hint'>Câu "+(qi+1)+"/"+Q.length+" · Điểm "+score+"</div><div class='bar'><i style='width:"+qi/Q.length*100+"%'></i></div><div class='card'><div style='font-size:22px;font-weight:800;margin-bottom:8px'>"+q[0]+"</div>"+q[1].map(function(o,i){return "<button class='opt' onclick='ans("+i+")'>"+o+"</button>"}).join("")+"<div class='fb' id='fb'></div></div>"}
function ans(i){if(answered)return;answered=true;done();var q=Q[qi],b=document.querySelectorAll(".opt");b[q[2]].classList.add("ok");if(i==q[2])score++;else b[i].classList.add("bad");
$("fb").innerHTML=(i==q[2]?"✅ Chính xác! ":"❌ Chưa đúng. ")+q[3]+"<div style='margin-top:10px'><button class='btn p' style='width:100%' onclick='qi++;quiz()'>"+(qi==Q.length-1?"Xem kết quả":"Câu tiếp theo →")+"</button></div>"}
function saved(){
var ws=ALL.filter(function(w){return S.saved[w[0]]}),gs=Object.keys(S.savedG);
var h="<h2>⭐ Từ vựng đã lưu ("+ws.length+")</h2><div class='card'>"+(ws.length?ws.map(function(w){return "<div class='sv'><div><b>"+w[0]+"</b> · <span style='color:var(--ac)'>"+w[1]+"</span><div class='ex'>"+w[2]+" "+w[3]+"</div></div><div class='row' style='flex:none;flex-wrap:nowrap'><button class='bm' onclick='speak(\""+w[2].replace(/"/g,"")+"\")'>🔊</button><button class='bm' onclick='tog(\""+w[0]+"\")'>✕</button></div></div>"}).join(""):"<span class='mu'>Chưa có từ nào. Bấm ☆ trên thẻ từ để lưu.</span>")+"</div>";
h+="<h2>📖 Bài ngữ pháp đã lưu ("+gs.length+")</h2>"+(gs.length?gs.map(function(i){return "<div class='card les'><div class='lh'><h3>"+G[i].t+"</h3><button class='bm' onclick='tg("+i+");saved()'>✕</button></div>"+G[i].b+"</div>"}).join(""):"<div class='card mu'>Chưa có bài nào. Bấm “Lưu” ở tab Ngữ pháp.</div>");
h+="<h2>🌐 Sổ từ đã dịch ("+S.tr.length+")</h2><div class='card'>"+(S.tr.length?S.tr.map(function(w,i){return "<div class='sv'><div><b>"+esc(w.en)+"</b> · <span style='color:var(--ac)'>"+esc(w.vi)+"</span><div class='ex'>"+esc(w.ex||"")+"</div></div><div class='row' style='flex:none;flex-wrap:nowrap'><button class='bm' onclick='speak(S.tr["+i+"].en)'>🔊</button><button class='bm' onclick='delTr("+i+")'>✕</button></div></div>"}).join(""):"<span class='mu'>Chưa có từ nào. Dùng tab Dịch rồi bấm Lưu vào sổ từ.</span>")+"</div>";
$("view").innerHTML=h}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
var NA="<div class='card'>Tính năng AI chưa sẵn sàng. Hãy mở trang này trong Claude và cho phép khi được hỏi.</div>";
async function api(body){
for(var n=0;n<2;n++){
var code="";try{code=localStorage.getItem("dpee_code")||""}catch(e){}
var res=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json","x-access-code":code},body:JSON.stringify(body)});
if(res.status==401){if(n==0){var c=prompt("Nhập mã truy cập của bạn:");if(!c)throw {code:"auth"};try{localStorage.setItem("dpee_code",c.trim())}catch(e){}continue}throw {code:"auth"}}
if(res.status==429)throw {code:"rate_limited"};
if(!res.ok)throw {code:"error"};
return await res.json()}}
function errText(e){return e&&e.code=="auth"?"Mã truy cập chưa đúng, hãy thử lại.":e&&e.code=="rate_limited"?"Bạn dùng hơi nhanh hoặc đã hết lượt hôm nay, thử lại sau nhé.":"Có lỗi khi gọi AI, bạn thử lại nhé."}
function aiErr(e){return "<div class='card'>"+errText(e)+"</div>"}
var dir="en",lastTr=null,busy=false,tv="";
function trans(){
$("view").innerHTML="<div class='card'><h3>🌐 Dịch từ và câu</h3><div class='chips'><button class='chip "+(dir=="en"?"on":"")+"' onclick='sd(\"en\")'>Anh → Việt</button><button class='chip "+(dir=="vi"?"on":"")+"' onclick='sd(\"vi\")'>Việt → Anh</button></div><textarea id='ti' rows='3' placeholder='"+(dir=="en"?"Nhập từ hoặc câu tiếng Anh…":"Nhập từ hoặc câu tiếng Việt…")+"'>"+esc(tv)+"</textarea><div class='row' style='margin-top:8px'><button class='btn p' onclick='doTr()'>Dịch</button></div></div><div id='tr'></div>";
if(lastTr)showTr()}
function sd(d){dir=d;lastTr=null;tv="";trans()}
async function doTr(){var t=$("ti").value.trim();if(!t||busy)return;tv=t;busy=true;$("tr").innerHTML="<div class='card mu'>Đang dịch…</div>";
try{lastTr=await api({mode:"translate",dir:dir,text:t});showTr()}catch(e){$("tr").innerHTML=aiErr(e)}
busy=false}
function showTr(){var r=lastTr;if(!r||!$("tr"))return;var sv=S.tr.some(function(x){return x.en==r.en});
$("tr").innerHTML="<div class='card'><div class='big' style='font-size:26px'>"+esc(r.en)+"</div><div class='vi' style='font-size:20px'>"+esc(r.vi)+"</div><div class='ex'>Đọc: "+esc(r.ipa)+"</div><p>"+esc(r.note)+"</p><div class='ex'>“"+esc(r.example)+"” · "+esc(r.example_vi)+"</div><div class='row' style='margin-top:12px'><button class='btn' onclick='speak(lastTr.en)'>🔊 Nghe</button><button class='btn p' onclick='saveTr()'>"+(sv?"⭐ Đã lưu":"☆ Lưu vào sổ từ")+"</button></div></div>"}
function saveTr(){var r=lastTr;if(!r)return;if(!S.tr.some(function(x){return x.en==r.en})){S.tr.unshift({en:r.en,vi:r.vi,ex:r.example});done()}save();showTr()}
function delTr(i){S.tr.splice(i,1);save();saved()}
var SC=[["Nói chuyện tự do","làm quen, nói chuyện hàng ngày","Hi! I’m your English friend. How was your day?"],["Họp, công việc","đồng nghiệp trao đổi công việc","Hi! Do you have a minute? Let’s talk about today’s task."],["Gọi món","nhân viên nhà hàng","Welcome! What would you like to order?"],["Hỏi đường","người qua đường ở thành phố","Hi! You look lost. Can I help you?"],["Phỏng vấn","nhà tuyển dụng phỏng vấn xin việc cơ bản","Hello! Please tell me a little about yourself."]];
var sci=0,msgs=[SC[0][2]].map(function(t){return {r:"assistant",t:t}}),cb=false,MIC=null,micInit=false;
function chat(){
var h="<div class='chips'>"+SC.map(function(s,i){return "<button class='chip "+(i==sci?"on":"")+"' onclick='setSc("+i+")'>"+s[0]+"</button>"}).join("")+"</div><div class='card'><div class='hint' style='margin-bottom:8px'>Gõ câu tiếng Anh của bạn. AI trả lời bằng tiếng Anh đơn giản và sửa lỗi cho bạn bằng tiếng Việt.</div><div class='msgs' id='ms'></div><div class='cin'><input class='ci' id='ci' placeholder='Viết tiếng Anh (hoặc tiếng Việt nếu chưa biết nói)…' onkeydown='if(event.key==\"Enter\")sendC()'><button class='btn' id='mic' style='display:none' onclick='micGo()'>🎤</button><button class='btn p' onclick='sendC()'>Gửi</button></div></div>";
$("view").innerHTML=h;rm();
if(window.SpeechRecognition||window.webkitSpeechRecognition){$("mic").style.display=""}}
function micGo(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;try{var r=new R();r.lang="en-US";r.onresult=function(x){var e=$("ci");if(e)e.value+=(e.value?" ":"")+x.results[0][0].transcript};r.start()}catch(e){}}
function setSc(i){sci=i;msgs=[{r:"assistant",t:SC[i][2]}];chat()}
function rm(){var e=$("ms");if(!e)return;e.innerHTML=msgs.map(function(m,i){if(m.r=="user")return "<div class='bub me'>"+esc(m.t)+"</div>";var p=m.t.split("💡"),t=p[0].trim();return "<div class='bub ai'>"+esc(t||"…")+(p[1]?"<div class='tip'>💡 "+esc(p[1].trim())+"</div>":"")+"<div><button class='bm' style='margin-top:6px' onclick='speak(msgs["+i+"].t.split(\"💡\")[0])'>🔊</button></div></div>"}).join("")}
async function sendC(){var e=$("ci");if(!e||cb)return;var t=e.value.trim();if(!t)return;e.value="";
var hist=msgs.slice(1).filter(function(m){return !m.err&&m.t}).map(function(m){return {r:m.r,t:m.t}});
msgs.push({r:"user",t:t});msgs.push({r:"assistant",t:"…"});rm();cb=true;var k=msgs.length-1;
try{var r=await api({mode:"chat",scenario:sci,starter:msgs[0].t,history:hist,text:t});msgs[k].t=r.text;rm();done()}
catch(er){msgs.splice(k-1,2);msgs.push({r:"assistant",t:errText(er),err:1});e.value=t;rm()}
cb=false}
render();setInterval(tick,30000);tick();
</script>
</body>
</html>
